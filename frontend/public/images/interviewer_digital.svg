<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#131A45"/>
      <stop offset="55%" stop-color="#0B1030"/>
      <stop offset="100%" stop-color="#05081C"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#60A5FA" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.26"/>
    </linearGradient>
    <linearGradient id="rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BE9FF"/>
      <stop offset="100%" stop-color="#B49EE8"/>
    </linearGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A2255" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0C112F" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7DE8FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="headClip">
      <path d="M200 78 C 245 78 268 110 268 150 C 268 176 262 196 250 214 C 238 232 220 248 200 248 C 180 248 162 232 150 214 C 138 196 132 176 132 150 C 132 110 155 78 200 78 Z"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <g stroke="#3B4B8F" stroke-width="0.6" opacity="0.10">
    <line x1="0" y1="80" x2="400" y2="80"/><line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/><line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="80" y1="0" x2="80" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
  </g>
  <g fill="#9FD8FF">
    <circle cx="52" cy="64" r="1.4" opacity="0.7"/><circle cx="338" cy="52" r="1.1" opacity="0.6"/>
    <circle cx="356" cy="196" r="1.5" opacity="0.5"/><circle cx="44" cy="238" r="1.2" opacity="0.55"/>
    <circle cx="88" cy="330" r="1" opacity="0.45"/><circle cx="322" cy="318" r="1.3" opacity="0.5"/>
    <circle cx="298" cy="90" r="1" opacity="0.5"/><circle cx="118" cy="52" r="0.9" opacity="0.45"/>
  </g>

  <!-- 头后光晕 -->
  <ellipse cx="200" cy="168" rx="150" ry="150" fill="url(#halo)"/>

  <!-- 运行轨道环 -->
  <ellipse cx="200" cy="168" rx="138" ry="52" fill="none" stroke="#5EEAD4" stroke-width="1" opacity="0.20" stroke-dasharray="2 10"/>
  <ellipse cx="200" cy="168" rx="126" ry="126" fill="none" stroke="#B49EE8" stroke-width="0.8" opacity="0.14" stroke-dasharray="18 12"/>
  <circle cx="326" cy="168" r="3" fill="#8BE9FF" opacity="0.9" filter="url(#glow)"/>

  <!-- 肩部西装（半透明全息） -->
  <path d="M62 400 C 68 336 104 300 148 288 C 168 282 178 278 200 278 C 222 278 232 282 252 288 C 296 300 332 336 338 400 Z" fill="url(#suit)"/>
  <path d="M62 400 C 68 336 104 300 148 288 C 168 282 178 278 200 278 C 222 278 232 282 252 288 C 296 300 332 336 338 400" fill="none" stroke="#5EEAD4" stroke-width="1" opacity="0.28"/>
  <path d="M168 288 L200 344 L232 288 L224 400 L176 400 Z" fill="#0A0E28" opacity="0.9"/>
  <path d="M194 292 L200 336 L206 292 Z" fill="url(#rim)" opacity="0.85" filter="url(#glow)"/>
  <circle cx="200" cy="368" r="3.4" fill="#8BE9FF" opacity="0.9" filter="url(#glow)"/>

  <!-- 脖子 -->
  <path d="M176 236 L176 268 C 176 280 224 280 224 268 L224 236 Z" fill="#141C48" opacity="0.95"/>
  <line x1="178" y1="252" x2="222" y2="252" stroke="#5EEAD4" stroke-width="1.2" opacity="0.5"/>

  <!-- 玻璃质感头部 -->
  <path d="M200 78 C 245 78 268 110 268 150 C 268 176 262 196 250 214 C 238 232 220 248 200 248 C 180 248 162 232 150 214 C 138 196 132 176 132 150 C 132 110 155 78 200 78 Z"
        fill="url(#glass)" stroke="url(#rim)" stroke-width="1.6" filter="url(#glow)"/>

  <!-- 头部线框：纬线 -->
  <g clip-path="url(#headClip)" stroke="#7DE8FF" fill="none" opacity="0.30">
    <path d="M136 120 C 165 108 235 108 264 120" stroke-width="1"/>
    <path d="M133 142 C 168 132 232 132 267 142" stroke-width="1"/>
    <path d="M133 164 C 168 156 232 156 267 164" stroke-width="1"/>
    <path d="M137 186 C 170 178 230 178 263 186" stroke-width="1"/>
    <path d="M146 208 C 175 200 225 200 254 208" stroke-width="1"/>
    <path d="M160 228 C 182 222 218 222 240 228" stroke-width="1"/>
  </g>
  <!-- 头部线框：经线 -->
  <g clip-path="url(#headClip)" stroke="#8BE9FF" fill="none" opacity="0.22">
    <path d="M200 78 C 200 130 200 200 200 248" stroke-width="1"/>
    <path d="M172 82 C 158 128 158 200 172 244" stroke-width="1"/>
    <path d="M228 82 C 242 128 242 200 228 244" stroke-width="1"/>
    <path d="M148 96 C 134 140 140 200 158 232" stroke-width="1"/>
    <path d="M252 96 C 266 140 260 200 242 232" stroke-width="1"/>
  </g>

  <!-- 面部核心：发光双眼 -->
  <g filter="url(#glow)">
    <path d="M166 156 Q 176 148 188 156" stroke="#8BE9FF" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M212 156 Q 224 148 234 156" stroke="#8BE9FF" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- 温和微笑 -->
  <path d="M186 202 Q 200 212 214 202" stroke="#B49EE8" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>

  <!-- 扫描线 -->
  <rect x="118" y="166" width="164" height="2.6" fill="url(#scanG)" filter="url(#glow)" opacity="0.9"/>
  <rect x="128" y="176" width="144" height="1.2" fill="url(#scanG)" opacity="0.5"/>

  <!-- 神经网络粒子 -->
  <g fill="#BFE9FF">
    <circle cx="152" cy="112" r="2" opacity="0.9" filter="url(#glow)"/>
    <circle cx="246" cy="106" r="2.2" opacity="0.9" filter="url(#glow)"/>
    <circle cx="160" cy="190" r="1.6" opacity="0.7"/>
    <circle cx="242" cy="186" r="1.8" opacity="0.75"/>
    <circle cx="200" cy="98" r="1.6" opacity="0.8" filter="url(#glow)"/>
    <circle cx="176" cy="230" r="1.4" opacity="0.6"/>
    <circle cx="228" cy="228" r="1.5" opacity="0.65"/>
  </g>
  <g stroke="#5EEAD4" stroke-width="0.7" opacity="0.35">
    <line x1="152" y1="112" x2="200" y2="98"/><line x1="200" y1="98" x2="246" y2="106"/>
    <line x1="160" y1="190" x2="176" y2="230"/><line x1="242" y1="186" x2="228" y2="228"/>
  </g>

  <!-- 底部数据流 -->
  <g font-family="monospace" font-size="9" fill="#5EEAD4">
    <text x="70" y="352" opacity="0.35">01001</text>
    <text x="298" y="352" opacity="0.35">10110</text>
  </g>
</svg>
